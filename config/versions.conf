#!/usr/bin/env bash
# =============================================================================
# config/versions.conf
# -----------------------------------------------------------------------------
# Central place to pin/override tool versions without touching any script.
# This file is sourced (not executed) by scripts/00-utils.sh, so it must
# contain only variable assignments — no side effects.
#
# Change a value, re-run ./install.sh, and only the affected module needs to
# do extra work (each module checks the currently installed version against
# these values before acting).
# =============================================================================

# --- Node.js -----------------------------------------------------------------
NODE_LTS_ALIAS="lts-latest"     # fnm alias; change to a specific version e.g. "20.17.0" to pin
PNPM_VERSION="latest"            # "latest" or a pinned semver e.g. "9.7.0"

# --- PHP -----------------------------------------------------------------
# Space-separated list of PHP versions to install side by side.
PHP_VERSIONS="8.2 8.3 8.4"
PHP_DEFAULT_VERSION="8.3"

# --- Java (OpenJDK via apt + update-alternatives) --------------------------
# Space-separated list of versions to install side by side, e.g. "17 21".
# Only 17 is installed by default; add more any time and re-run:
#   ./install.sh --only 10
JAVA_VERSIONS="17"
JAVA_DEFAULT_VERSION="17"

# --- Databases ---------------------------------------------------------------
MYSQL_DEV_USER="devuser"
MYSQL_DEV_PASSWORD="devpassword"   # override in .env for anything beyond a local sandbox
MYSQL_DEV_DATABASE="devdb"

POSTGRES_DEV_USER="devuser"
POSTGRES_DEV_PASSWORD="devpassword"
POSTGRES_DEV_DATABASE="devdb"

# --- Workspace ---------------------------------------------------------
# Where development projects are stored. Supports a leading ~ for the home dir.
WORKSPACE_DIR="~/Projects"

# --- Python (pipx-managed global CLI tools) -----------------------------
# Space-separated list of packages installed via `pipx install`.
PIPX_TOOLS="virtualenv poetry black ruff mypy ipython httpie"

# --- Rust ----------------------------------------------------------------
RUST_TOOLCHAIN="stable"
CARGO_UTILS="cargo-edit cargo-watch cargo-generate"

# --- Docker --------------------------------------------------------------
DOCKER_COMPOSE_PLUGIN="docker-compose-plugin"

# --- NVIDIA / Hardware Drivers -----------------------------------------------
INSTALL_NVIDIA_DRIVER="ask"      # ask | yes | no
INSTALL_CUDA_TOOLKIT="ask"       # ask | yes | no

# --- AI Agents ---------------------------------------------------------------
INSTALL_ANTIGRAVITY_IDE="yes"    # yes | no
INSTALL_ANTIGRAVITY_APP="yes"    # yes | no
INSTALL_CLAUDE_CODE="yes"        # yes | no
INSTALL_CODEX_CLI="yes"          # yes | no

export NODE_LTS_ALIAS PNPM_VERSION PHP_VERSIONS PHP_DEFAULT_VERSION \
       JAVA_VERSIONS JAVA_DEFAULT_VERSION MYSQL_DEV_USER MYSQL_DEV_PASSWORD \
       MYSQL_DEV_DATABASE POSTGRES_DEV_USER POSTGRES_DEV_PASSWORD \
       POSTGRES_DEV_DATABASE RUST_TOOLCHAIN CARGO_UTILS DOCKER_COMPOSE_PLUGIN \
       INSTALL_NVIDIA_DRIVER INSTALL_CUDA_TOOLKIT PIPX_TOOLS WORKSPACE_DIR \
       INSTALL_ANTIGRAVITY_IDE INSTALL_ANTIGRAVITY_APP INSTALL_CLAUDE_CODE INSTALL_CODEX_CLI
