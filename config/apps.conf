#!/usr/bin/env bash
# =============================================================================
# config/apps.conf
# -----------------------------------------------------------------------------
# Desktop application manifest used by scripts/15-desktop-apps.sh.
#
# SNAP_APPS      -> installed with `snap install`
# APT_REPO_APPS  -> installed via each vendor's official apt repository
# DEB_URL_APPS   -> installed by downloading an official .deb and running it
#                   through apt (dependency-safe), keyed by dpkg package name
# =============================================================================

# Only these four applications are installed via snap, per project policy.
# Format: "candidate1|candidate2|...:snap_flag"
# Multiple pipe-separated candidates are tried in order — useful for
# WhatsApp, which has no official Linux client and several competing
# community snaps; the installer falls through to the next one if the
# first is unavailable or removed from the store.
SNAP_APPS=(
    "android-studio:classic"
    "postman:"
    "telegram-desktop:"
    "whatsie|whatsapp-linux-app|whatsapp-electron:"
)

# Apps with an official apt repository (preferred method).
# Format: "name"
APT_REPO_APPS=(
    google-chrome
    vscode
    discord_repo
)

export SNAP_APPS APT_REPO_APPS
